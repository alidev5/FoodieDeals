# Both apps are single-page builds: unknown paths fall back to index.html for the client router.
server {
  listen 8081;
  root /usr/share/nginx/customer;
  location / { try_files $uri $uri/ /index.html; }
}

server {
  listen 8082;
  root /usr/share/nginx/restaurant;
  location / { try_files $uri $uri/ /index.html; }
}
